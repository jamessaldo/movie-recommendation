<!-- Movie Card -->
<div
  class="uk-card uk-card-default uk-card-hover movie-card uk-transition-toggle"
>
  <!-- Poster -->
  <div class="uk-card-media-top uk-overflow-hidden uk-position-relative">
    <img
      src="{{posterUrl}}"
      alt="{{title}} movie poster"
      class="uk-width-1-1 movie-poster"
      style="
        aspect-ratio: 2/3;
        object-fit: cover;
        height: 240px;
        display: block;
      "
      onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
    />
    <!-- Single fallback for any image issues -->
    <div
      class="uk-flex uk-flex-center uk-flex-middle uk-background-muted image-fallback"
      style="aspect-ratio: 2/3; height: 240px; display: none"
    >
      <div class="uk-text-center">
        <uk-icon icon="image" class="uk-text-muted" style="ratio: 2"></uk-icon>
        <div class="uk-text-small uk-text-muted uk-margin-small-top">
          No Poster
        </div>
      </div>
    </div>

    <!-- Rating Badge -->
    <div class="uk-position-top-right uk-margin-small">
      <span class="uk-badge uk-badge-warning">
        <uk-icon icon="star" style="color: #fff; margin-right: 4px"></uk-icon>
        {{rating}}
      </span>
    </div>
  </div>

  <!-- Movie Info -->
  <div class="uk-card-body uk-padding-small">
    <h3
      class="uk-card-title uk-margin-remove uk-text-truncate uk-text-small"
      title="{{title}}"
    >
      {{title}}
    </h3>
    <div class="mt-2">
      <span class="text-sm text-gray-500 flex items-center">
        <svg
          class="w-4 h-4 mr-2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          ></path>
        </svg>
        {{releaseYear}}
      </span>
    </div>

    <!-- Rating Controls -->
    <div class="mt-3">{{> rating/controls}}</div>

    <!-- Rating Stats -->
    {{> rating/stats}}
  </div>
</div>
