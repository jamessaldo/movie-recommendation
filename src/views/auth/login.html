<!-- Login Form -->
<form
  class="flex items-center space-x-3"
  hx-post="/login"
  hx-target=".auth-content"
  hx-swap="innerHTML"
  hx-indicator="#login-spinner"
>
  <div class="flex flex-col space-y-1">
    <div class="relative">
      <div
        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
      >
        <svg
          class="h-4 w-4 text-blue-200"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
            clip-rule="evenodd"
          />
        </svg>
      </div>
      <input
        type="text"
        name="username"
        placeholder="Enter username"
        class="w-64 pl-10 pr-4 py-2 bg-white/20 border border-white/30 rounded-lg text-white placeholder-blue-200 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent backdrop-blur-sm transition-all duration-200"
        required
        minlength="4"
        maxlength="30"
        pattern="[A-Za-z0-9_]+"
        title="Username: 4-30 characters, letters, numbers, and underscores only"
      />
    </div>
  </div>

  <button
    type="submit"
    class="px-6 py-2 bg-white/20 hover:bg-white/30 border border-white/30 rounded-lg text-white font-medium transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-white/50 backdrop-blur-sm flex items-center space-x-2"
  >
    <svg
      id="login-spinner"
      class="animate-spin h-4 w-4 text-white htmx-indicator"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      ></path>
    </svg>
    <span>Login</span>
  </button>

  {{#if error}}
  <div
    class="absolute top-full mt-2 left-0 right-0 bg-red-500/90 text-white px-4 py-2 rounded-lg backdrop-blur-sm border border-red-400"
  >
    <p class="text-sm">{{error}}</p>
  </div>
  {{/if}}
</form>
