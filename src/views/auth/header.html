<!-- User Menu -->
<div class="relative">
  <button
    class="uk-btn uk-btn-default flex items-center space-x-2 px-4 py-2 bg-white/20 hover:bg-white/30 border border-white/30 rounded-lg text-white font-medium transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-white/50 backdrop-blur-sm"
    type="button"
  >
    <div
      class="flex items-center justify-center w-8 h-8 bg-white/20 rounded-full"
    >
      <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
        <path
          fill-rule="evenodd"
          d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
    <span>{{username}}</span>
    <svg
      class="w-4 h-4 text-white transform transition-transform duration-200"
      fill="currentColor"
      viewBox="0 0 20 20"
      id="dropdown-arrow"
    >
      <path
        fill-rule="evenodd"
        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  <div
    class="uk-drop uk-dropdown min-w-52"
    data-uk-dropdown="mode: click; animation: uk-anmt-slide-top-sm; offset: 0"
  >
    <ul class="uk-nav uk-dropdown-nav">
      <li class="p-4 border-b border-gray-200">
        <p class="text-xs text-gray-500 uppercase tracking-wider">
          Signed in as
        </p>
        <p class="text-sm font-semibold text-gray-800">{{username}}</p>
      </li>
      <li class="p-2">
        <form
          hx-post="/logout"
          hx-target=".auth-content"
          hx-swap="innerHTML"
          class="w-full"
        >
          <button
            type="submit"
            class="w-full flex items-center space-x-2 px-3 py-2 text-left text-red-600 hover:bg-red-50 hover:text-red-700 rounded-md transition-all duration-200"
            style="cursor: pointer"
          >
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path
                fill-rule="evenodd"
                d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z"
                clip-rule="evenodd"
              />
            </svg>
            <span>Logout</span>
          </button>
        </form>
      </li>
    </ul>
  </div>
</div>
